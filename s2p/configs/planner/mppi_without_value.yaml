# mutual information evaluator configuration

_target_: s2p.planners.mppi_planner.MPPIPlanner

task: ${task}

cfg:
  device: ${device}
  horizon: 3
  num_samples: 512
  iterations: 6
  num_elites: 64
  min_std: 0.05
  max_std: 2
  temperature: 0.5
  discount: 0.95
  frameskip: 1
  use_value: False
  fraction_of_policy_trajectories: 0