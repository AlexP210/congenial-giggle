# tdmcp2 teacher configuration

_target_: s2p.models.tdmpc2_world_model.get_or_create

task: ${task}

cfg:

  freeze: false

  tdmpc2_cfg:
    task: ${task.cfg.task_name}
    obs: state
    episodic: false
    device: ${device}

    # evaluation
    checkpoint: /path/to/project/logs/cheetah-jump/1/default/models/best.pt
    # eval_episodes: 5
    # eval_freq: 50000

    # training
    # steps: 10_000_000
    # batch_size: ${trainer.cfg.batch_size}
    reward_coef: 0.1
    value_coef: 0.1
    termination_coef: 1
    consistency_coef: 20
    rho: 0.5
    lr: 3e-4
    enc_lr_scale: 0.3
    grad_clip_norm: 20
    tau: 0.01
    discount_denom: 5
    discount_min: 0.95
    discount_max: 0.995
    # buffer_size: 1_000_000
    exp_name: default
    # data_dir: ???

    # planning
    mpc: true
    iterations: 6
    num_samples: 512
    num_elites: 64
    num_pi_trajs: 24
    horizon: 3
    min_std: 0.05
    max_std: 2
    temperature: 0.5

    # actor
    log_std_min: -10
    log_std_max: 2
    entropy_coef: 1e-4

    # critic
    num_bins: 101
    vmin: -10
    vmax: +10

    # architecture
    # model_size: ???
    num_enc_layers: 2
    enc_dim: 256
    num_channels: 32
    mlp_dim: 512
    latent_dim: ${latent_dimension}
    task_dim: 96
    num_q: 5
    dropout: 0.01
    simnorm_dim: 8

    # # logging
    # wandb_project: Distilling-Planners
    # wandb_entity: <wandb-entity>
    # wandb_silent: false
    # enable_wandb: true
    # save_csv: true

    # misc
    compile: false
    # save_video: true
    # save_agent: true
    seed: ${seed}

    # convenience
    work_dir: /path/to/tdmpc2_data/outputs
    task_title: TDMPC2 World Model
    multitask: false
    # tasks: mt30
    # obs_shape: ???
    # action_dim: ???
    # episode_length: ???
    # obs_shapes: ???
    # action_dims: ???
    # episode_lengths: ???
    # seed_steps: ???
    # bin_size: ???
    # The below control how the state dict for a past checkpoint is loaded
    # You may want to not load the weights for certain modules and train
    # from scratch, or freeze certain modules.
      # - encoder
      # - dynamics
      # - value
      # - reward
      # - task
    components_to_train_from_scratch: []
    components_to_freeze: []

