# Frozen reward head over a Sparse Imagination latent, for the ManiSkill PushCube task.
#
# Not Sparse-Imagination-specific as a class: DINOWMRewardModel asks its encoder only for
# `_unflatten_latent` and `write_action_into_newest_frame`, which every DINO-WM-family wrapper
# has -- the head reads its token count and width off a probe encode, so a `drop98` latent
# needs no config change. What makes this config Sparse Imagination's is the checkpoint below,
# which was fitted against that world model's latent and is meaningless over any other.
#
# Written by train_sparse_imagination_reward_push_cube.yaml. `freeze: true` also means
# `save_to_file` records a reference to that checkpoint rather than copying its weights.
#
# ### The kept-patch subset has to be pinned to use this head
#
# frozen_sparse_imagination_push_cube.yaml runs `drop: true` with
# `resample_kept_patches_on_goal: true`, so `set_goal` redraws which 98 of the 196 patch
# tokens the latent carries -- once per episode. That is right for the world model, whose
# predictor has frame-only positional embeddings and so is deliberately indifferent to which
# patches it gets, and right for `state_value`, which re-encodes the goal under the new subset.
#
# It is wrong for this head. The cross-attention pools a flat token sequence with learned
# queries, so its weights are specific to the subset it was fitted on -- and offline training
# never calls `set_goal`, meaning the head saw only the initial seeded draw. Leaving the
# resample on would score every episode after the first against tokens the head never trained
# against.
#
# So an evaluation using this reward head must also set, on the world model:
#
#   sparse_imagination.cfg.resample_kept_patches_on_goal: false
#
# with `kept_patch_seed` left at the 0 the training run used, which pins one subset for the
# model's lifetime and makes it the same one. `state_value` is unaffected -- it re-encodes the
# goal either way.

_target_: s2p.models.dino_wm_reward_model.DINOWMRewardModel

task: ${task}
encoder: ${encoder}

cfg:
  embedding_dim: 512
  n_heads: 1
  n_queries: 4
  ff_hidden_layers: 2
  ff_hidden_dim: 512
  n_blocks: 1
  head_hidden_layers: 1
  head_hidden_dim: 512
  device: ${device}
  # A single uninterrupted 8h fit on world-model epoch 21. Read from inc3_runs/, the copy
  # fetch_inc3_runs.sh takes from Nibi.
  checkpoint: ${output_dir}/../inc3_runs/reward_heads/SparseImaginationReward_push_cube_CorrectData_BestCkpt-20260924_044918/loss/best_total_loss/reward.pt
  freeze: true
