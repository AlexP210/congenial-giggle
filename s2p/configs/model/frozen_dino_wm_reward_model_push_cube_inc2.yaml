# Frozen reward head over a DINO-WM latent, for the ManiSkill PushCube task.
#
# INCREMENT 2 (the 48h run). Fitted on 2026-08-26/11-19-56_push_cube at epoch 16 -- that
# run's last epoch and also its best, so `model_best.pth` and `model_latest.pth` there are
# bit-identical and `resume_checkpoint` makes no difference for this pairing.
#
# The increment-3 head is `frozen_dino_wm_reward_model_push_cube.yaml`; pair each only with
# the world-model config of the same increment.

_target_: s2p.models.dino_wm_reward_model.DINOWMRewardModel

task: ${task}
encoder: ${encoder}

cfg:
  embedding_dim: 512
  n_heads: 1
  n_queries: 4
  ff_hidden_layers: 2
  ff_hidden_dim: 512
  n_blocks: 1
  head_hidden_layers: 1
  head_hidden_dim: 512
  device: ${device}
  # The 08-30 head: fitted on the task's default ppo-visual-wrist demos, not on the
  # ppo-staged recording the world model itself was trained on. It is the only DINO-WM
  # PushCube head from the increment-2 era; the ppo-staged one
  # (DINOWMReward_push_cube_CorrectData_BestCkpt-20260914_102740) was fitted on increment 3
  # and belongs to `frozen_dino_wm_reward_model_push_cube.yaml`, not here.
  checkpoint: ${output_dir}/checkpoints/DINOWMReward_PushCube-20260830_025749/loss/best_total_loss/reward.pt
  freeze: true