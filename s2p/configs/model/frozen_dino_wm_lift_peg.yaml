# Frozen DINO-WM teacher configuration -- increment 3 (the 72h run).
#
# The increment-2 (48h) pairing this replaced is kept alongside as
# `frozen_dino_wm_lift_peg_inc2.yaml`; the two are not interchangeable, since each is tied
# to the reward head fitted on it.

_target_: s2p.models.dino_world_model.get_or_create

# `cfg.dinowm_cfg` below is DINO-WM's own train config, and it is full of `_target_`s
# (model, encoder, predictor, decoder, ...) that Trainer instantiates itself, in order,
# once it knows the dataset dimensions. Hydra instantiates recursively by default and
# would build them here instead — it gets as far as `dinowm_cfg.model` and fails with
# "VWorldModel.__init__() missing 5 required positional arguments". `_recursive_` is only
# honoured as "do not instantiate my kwargs" on a node that has a `_target_`, so it has to
# sit here rather than on `dinowm_cfg`; the cost is that `task` below arrives as a config
# too, which DINOWorldModel.__init__ rebuilds (get_or_create memoizes, so it is the same
# task object every other model is handed).
_recursive_: false

task: ${task}

cfg:
  freeze: true
  device: ${device}
  # The task's dataset ships DINOv3 patch features precomputed with this very backbone
  # (196x384, dinov3_vits16), so encode_obs short-circuits to them and offline batches
  # never run the ViT. Leave unset only if you want to force the live visual path.
  dino_feature_key: dino_patch_features
  # Order matters: this is concatenated in sequence and must reproduce liftpeg_dset's
  # PROPRIO_KEYS = [obs/agent/qpos, obs/agent/qvel, obs/extra/tcp_pose] (9+9+7=25), which
  # is what this model's proprio encoder was trained on. qpos/qvel are added to the task's
  # observation by the task config.
  proprio_keys: [qpos, qvel, tcp_pose]
  visual_key: rgb

  # Which file inside `checkpoints/` to load. `Trainer.init_models` only ever reads
  # `model_latest.pth` -- the name is written out literally in dino_wm/train.py:225 -- so a run
  # whose best epoch is not its last is unreachable through `resume_folder` alone. This is
  # loaded over it by `DINOWorldModel.__init__`, through the same native-checkpoint path the
  # Trainer would have used. null keeps the Trainer's own choice.
  #
  # model_best.pth here: this run's last epoch (24) was also its lowest-validation one
  # (0.0070), so the two files hold the same training state -- but the reward head below was
  # fitted on `model_best.pth`, so name it rather than rely on the coincidence.
  resume_checkpoint: model_best.pth

  # Flattened from the wandb config export of the training run (wandb nests every key
  # under `value:`; Trainer reads them flat, e.g. cfg.frameskip / cfg.env.dataset).
  # Key order and grouping follow dino_wm/conf/train.yaml so the two stay diffable.
  # Interpolations are deliberately NOT used inside this block: they resolve from the
  # composed config root, not from here, so intra-block refs like ${img_size} would
  # miss. Literals are inlined instead — keep them in sync by hand.
  dinowm_cfg:
    # folder containing the run to resume from; Trainer.init_models loads
    # ${resume_folder}/checkpoints/model_latest.pth. With the wrapper's own
    # load_from_file call commented out, this is the ONLY thing that puts trained
    # weights into the model -- if the path is wrong it silently stays random-init.
    #
    # Whichever is chosen here has to be the one the frozen reward head was fitted on
    # (frozen_dino_wm_reward_model_lift_peg.yaml): that head cross-attends this model's
    # latent window, so it is tied to these exact weights.
    #
    # Increment 3, epochs 17-24: the run that resumed 2026-08-26/11-31-31 at epoch 16.
    # Validation fell monotonically to 0.0070 at epoch 24, so `model_best.pth` is that last
    # epoch and is the 72h best; the head named below was fitted on it.
    # Read from inc3_runs/, the copy fetch_inc3_runs.sh takes from Nibi.
    resume_folder: ${output_dir}/../inc3_runs/dino/outputs/2026-09-08/21-55-59_lift_peg
    ckpt_base_path: ${output_dir}/../dino
    data_dir: ${data_dir}
    debug: false

    img_size: 224
    frameskip: 1
    concat_dim: 1
    normalize_action: true

    num_hist: 3
    num_pred: 1
    has_predictor: true
    has_decoder: true

    # action encoder
    action_emb_dim: 10
    num_action_repeat: 1

    # proprio encoder
    proprio_emb_dim: 10
    num_proprio_repeat: 1

    env:
      name: lift_peg
      args: []
      kwargs:
        goal_data_path: ${data_dir}/maniskill/LiftPegUpright-v1.1-ppo-staged-pd_ee_delta_pos/videos/trajectory.rgb.pd_ee_delta_pos.physx_cuda.dino16.mmap.frac1.0.h5
      dataset:
        # Matches the task's own data_path (configs/task/maniskill_lift_peg.yaml). The camera
        # is read off the file itself and both rgb and
        # dino_patch_features are looked up under it, so liftpeg_dset needs no camera= here.
        # This is the exact recording the run below was trained on, so the action/proprio
        # normalization stats recomputed here match the training ones.
        _target_: datasets.liftpeg_dset.load_liftpeg_slice_train_val
        data_path: ${data_dir}/maniskill/LiftPegUpright-v1.1-ppo-staged-pd_ee_delta_pos/videos/trajectory.rgb.pd_ee_delta_pos.physx_cuda.dino16.mmap.frac1.0.h5
        n_rollout: null
        split_ratio: 0.8
        normalize_action: true
        transform:
          _target_: datasets.img_transforms.default_transform
          img_size: 224
      decoder_path: null
      num_workers: 16

    model:
      _target_: models.visual_world_model.VWorldModel
      image_size: 224
      num_hist: 3
      num_pred: 1
      train_encoder: false
      train_predictor: true
      train_decoder: true

    encoder:
      _target_: models.dinov3.DinoV3Encoder
      name: dinov3_vits16
      weights: ${checkpoint_dir}/dino/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
      repo_dir: ${project_root}/dependencies/dinov3
      feature_key: x_norm_patchtokens

    predictor:
      _target_: models.vit.ViTPredictor
      depth: 6
      heads: 16
      mlp_dim: 2048
      pool: mean
      dropout: 0.1
      emb_dropout: 0

    decoder:
      _target_: models.vqvae.VQVAE
      channel: 384
      n_embed: 2048
      n_res_block: 4
      n_res_channel: 128
      quantize: false

    action_encoder:
      _target_: models.proprio.ProprioceptiveEmbedding
      num_frames: 1
      tubelet_size: 1
      use_3d_pos: false

    proprio_encoder:
      _target_: models.proprio.ProprioceptiveEmbedding
      num_frames: 1
      tubelet_size: 1
      use_3d_pos: false

    training:
      seed: 0
      epochs: 100
      batch_size: 32
      save_every_x_epoch: 1
      save_best: true
      reconstruct_every_x_batch: 500
      num_reconstruct_samples: 6
      encoder_lr: 1.0e-06
      decoder_lr: 0.0003
      predictor_lr: 0.0005
      action_encoder_lr: 0.0005

    # Planning evals during training; plan_cfg_path null disables them, but Trainer
    # still reads plan_settings.* so the block has to exist.
    plan_settings:
      plan_cfg_path: null
      planner: [gd, cem]
      goal_source: [dset, random_state]
      goal_H: [5]
      alpha: [0.1, 1]

    # Trainer overwrites these in __init__ (saved_folder <- os.getcwd(), the batch sizes
    # <- training.batch_size / num_processes). Kept only so the block round-trips.
    saved_folder: ${output_dir}/../dino
    gpu_batch_size: 32
    effective_batch_size: 32
