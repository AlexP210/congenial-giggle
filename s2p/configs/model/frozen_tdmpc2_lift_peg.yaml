# tdmcp2 teacher configuration

_target_: s2p.models.tdmpc2_world_model.get_or_create

task: ${task}

cfg:

  freeze: true

  # Which leaf of the task's observation TensorDict the encoder reads. `null` for a state-based
  # teacher, which is handed the observation itself rather than a dict of them.
  observation_key: rgb

  tdmpc2_cfg:
    # TD-MPC2's own task name (tdmpc2/envs/custom_maniskill.py's CUSTOM_MANISKILL_TASKS), not the
    # ManiSkill id: it keys PROPRIO_KEYS, i.e. which fields make up the rgb_state proprio vector.
    task: lift-peg-upright
    obs: rgb_state
    episodic: false
    device: ${device}
    dino_reward: false

    # evaluation
    checkpoint: ${output_dir}/../tdmpc2/lift-peg-upright/TDMPC2_lift-peg/default/models/epoch_730000.pt
    # eval_episodes: 5
    # eval_freq: 50000

    # training
    # steps: 10_000_000
    # batch_size: ${trainer.cfg.batch_size}
    reward_coef: 0.1
    value_coef: 0.1
    termination_coef: 1
    consistency_coef: 20
    rho: 0.5
    lr: 3e-4
    enc_lr_scale: 0.3
    grad_clip_norm: 20
    tau: 0.01
    discount_denom: 5
    discount_min: 0.95
    discount_max: 0.995
    # buffer_size: 1_000_000
    exp_name: default
    # data_dir: ???

    # planning
    mpc: true
    iterations: 6
    num_samples: 512
    num_elites: 64
    num_pi_trajs: 24
    horizon: 3
    min_std: 0.05
    max_std: 2
    temperature: 0.5

    # actor
    log_std_min: -10
    log_std_max: 2
    entropy_coef: 1e-4

    # critic
    num_bins: 101
    vmin: -10
    vmax: +10

    # architecture
    # model_size: ???
    num_enc_layers: 2
    enc_dim: 256
    num_channels: 32
    mlp_dim: 512
    latent_dim: ${latent_dimension}
    task_dim: 96
    num_q: 5
    dropout: 0.01
    simnorm_dim: 8

    # # logging
    # wandb_project: Distilling-Planners
    # wandb_entity: <wandb-entity>
    # wandb_silent: false
    # enable_wandb: true
    # save_csv: true

    # misc
    compile: false
    # save_video: true
    # save_agent: true
    seed: ${seed}

    # convenience
    output_dir: /path/to/tdmpc2_data/outputs
    # Required by `parse_cfg`, which builds `work_dir` from it. A literal rather than `???`
    # because no S2P command line passes a tdmpc2_cfg run name -- and the work_dir it names
    # goes unused here anyway, since S2P logs through its own runner rather than TD-MPC2's
    # Logger.
    run_name: frozen_tdmpc2_pushcube
    task_title: TDMPC2 World Model
    multitask: false
    # tasks: mt30
    # obs_shape: ???
    # action_dim: ???
    # episode_length: ???
    # obs_shapes: ???
    # action_dims: ???
    # episode_lengths: ???
    # seed_steps: ???
    # bin_size: ???
    # The below control how the state dict for a past checkpoint is loaded
    # You may want to not load the weights for certain modules and train
    # from scratch, or freeze certain modules.
      # - encoder
      # - dynamics
      # - value
      # - reward
      # - task
    # Must stay empty here: this model starts fresh (tdmpc2_cfg.checkpoint is null), so listing
    # components has no effect when training from scratch, but it silently discards them when a
    # checkpoint *is* loaded later via `agent.cfg.checkpoint_folder` - TDMPC2.load() overwrites
    # every listed component's weights with the fresh init. "value" covers _Qs/_target_Qs_params/
    # _detach_Qs_params/_pi/_termination, so listing all five left evals with a random critic and
    # policy. Set this explicitly (per-run override) only when partial warm-starting is intended.
    # components_to_train_from_scratch: []
    # components_to_freeze: []

