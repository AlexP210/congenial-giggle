# TEMP config for FLOPs / latency measurement only -- NOT a planning result.
#
# Every checkpoint named below is simply the best that exists on disk today; where a cell has
# no properly-trained reward head the config still points at one of the right shape, because a
# FLOPs count and a plan-latency measurement depend on architecture, not on weights. Generated
# 2026-09-23. The non-temp evaluate_*.yaml files remain the ones to cite.
#
# root configuration that composes component-specific configs via Hydra
# only the "wiring" is kept here; actual parameters live in sub-files
#
# Runs a TC-WM checkpoint trained through TC-WM's own push_cube env and dataset, wrapped by
# TCWorldModel, in S2P's ManiSkill PushCube task. The counterpart of
# evaluate_dino_wm_push_cube.yaml, and mutually exclusive with it: TC-WM and DINO-WM claim
# the same rootless top-level module names, so one process can host one or the other (see
# s2p.lib.tc_wm_path). For the same reason there is no TC-WM PushT config — S2P's PushT task
# is built on DINO-WM's own PushT env.

defaults:
  - runner: evaluation
  - task: maniskill_push_cube

  - model@tc_wm: frozen_tc_wm_push_cube
  - model@tc_wm_reward: frozen_tc_wm_reward_model_push_cube

  # The world model is encoder and dynamics only -- it has no reward head and no
  # goal-distance `state_value`, so the planner scores the fitted reward head below
  # and `use_value: false` is the only correct setting. See the wrapper's
  # "Where the reward comes from".
  - planner: mppi_without_value

  - agent: fresh_agent

  - evaluators@evaluators.simulation_task_planning: simulation_task_planning
  - evaluators@evaluators.real_task_planning: real_task_planning
  - evaluators@evaluators.plan_latency: plan_latency
  - evaluators@evaluators.flops: flops
  # - evaluators@evaluators.rollout_error: rollout_error
  - evaluators@evaluators.planner_convergence: planner_convergence

  - _self_

data_horizon: 2

encoder: ${tc_wm}
dynamics: ${tc_wm}
reward: ${tc_wm_reward}
value: null
policy: null

planner:
  cfg:
    horizon: 5
    num_samples: 64
    num_elites: 8
    iterations: 6
    # No policy to seed from, and a non-zero fraction with `policy: null` is a NameError.
    fraction_of_policy_trajectories: 0
    # An ordinary discount over the fitted per-step reward, not a scale on a terminal
    # objective as it was upstream.
    discount: 1.0

device: cuda:0
seed: 1

local_dir: null
project_root: ???
data_dir: ???
checkpoint_dir: ???
output_dir: ???
