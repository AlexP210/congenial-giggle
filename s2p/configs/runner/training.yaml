# configuration specific to the training runner (overrides or complements defaults)

_target_: s2p.runners.training_runner.TrainingRunner

task: ${task}

cfg:
  compile: true
  compile_mode: default
  max_iterations: 1_000_000
  evaluation_interval: 10_000
  log_interval:  500
  save_path: ${output_dir}/checkpoints
  use_wandb: true
  wandb_project: Squeeze-to-Plan
  run_name: ???
  group_name: null
  device: ${device}
  learning_rate: 1e-5
  seed: ${seed}

trainer: ${trainer}
model: ${agent}
evaluators: ${evaluators}