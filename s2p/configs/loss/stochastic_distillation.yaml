# distillation loss configuration

_target_: s2p.losses.stochastic_distillation_loss.StochasticDistillationLoss

cfg:
  dynamics_ll_coefficient: 1
  reward_ll_coefficient: 1
  kl_coefficient: 1
  kl_mode: dynamics
  # Ablation switches: stop each term's gradient at the encoder, without removing the term.
  # False everywhere means every loss trains the encoder, as before.
  stop_reward_loss: False
  stop_dynamics_loss: False
  stop_kl_loss: False
  dynamics_target: sample
  imagination_rollout_method: sample
  use_target_encoder: False
  latent_rewards_imagination_horizon: ${loss_horizon}
  latent_dynamics_imagination_horizon: ${loss_horizon}
  lam: 1
  rho: 0.5
  alpha: 1