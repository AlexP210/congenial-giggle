# stochastic student configuration

_target_: s2p.tasks.visual_dmcontrol_task.VisualDMControlTask

cfg:
  task_name: cheetah-jump

  training_data_path: ${data_dir}/tdmpc2/mt30-visual-cheetah-jump-training.pt
  validation_data_path: ${data_dir}/tdmpc2/mt30-visual-cheetah-jump-validation.pt
  seed: ${seed}
  horizon: 4
  fraction: 1.0
  overlap_ratio: 0.0
  load_device: cpu
  batch_device: ${device}