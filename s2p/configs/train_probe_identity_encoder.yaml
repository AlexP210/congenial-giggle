# root configuration that composes component-specific configs via Hydra
# only the "wiring" is kept here; actual parameters live in sub-files

defaults:
  - runner: training
  - trainer: offline
  - task: offline_maniskill_push_cube

  - model@teacher_encoder: identity_encoder_cube_pose
  - model@student_encoder: fresh_mlp_probe_encoder
  - model@encoder: teacher_student_encoder

  - model@dynamics: fresh_dynamics_deterministic_mlp
  - model@reward: fresh_reward_deterministic_mlp
  - model@value: fresh_tdmpc2
  - model@policy: fresh_tdmpc2

  - agent: fresh_agent

  - planner: mppi_with_value

  - loss@loss_functions.probe: probe_push_cube_cube_pose

  - _self_

evaluators: {}

loss_function_weights:
  probe: 1.0

latent_dimension: 512
probe_target_path: ["state", "cube_pose"]

device: cuda:0
seed: 1

data_dir: ???
checkpoint_dir: ???
output_dir: ???