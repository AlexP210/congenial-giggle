# root configuration that composes component-specific configs via Hydra
# only the "wiring" is kept here; actual parameters live in sub-files
#
# Trains a reward head on top of a frozen DINO-Bisim checkpoint, in S2P's ManiSkill PlaceSphere
# task. DINO-Bisim's own `reward` is identically zero -- it plans by driving the latent to a
# goal latent -- so a planner that sums rewards needs one fitted here first; the resulting
# `reward.pt` is what a `frozen_dino_wm_reward_model_*` config loads at evaluation time.
#
# The counterpart of train_dino_wm_reward_place_sphere.yaml, and mutually exclusive with it: the
# forks claim the same rootless top-level module names, so one process can host one of them
# (see s2p.lib.dino_bsmpc_path).

defaults:
  - runner: training
  - trainer: offline
  - task: maniskill_place_sphere

  - model@dino_bisim: frozen_dino_bisim_place_sphere
  # Not DINO-Bisim-specific: DINOWMRewardModel asks its encoder only for `_unflatten_latent`
  # and `write_action_into_newest_frame`, which every DINO-WM-family wrapper has.
  - model@reward: fresh_dino_wm_reward_model

  # - planner: mppi_with_value
  - agent: fresh_agent

  - loss@loss_functions.reward: dino_wm_reward_loss

  - evaluators@evaluators.loss: loss

  - _self_

data_horizon: 2

# Fit the reward head on the PPO-staged recording instead of the task's default
# ppo-visual-wrist demos. `_self_` comes last in the defaults, so this wins over the `task`
# group. `json_path` moves with `data_path`: the json is the episode index for the h5 beside
# it, and pairing one dataset's h5 with another's index misreads every episode boundary.
task:
  cfg:
    data_path: ${data_dir}/maniskill/${.task_name}-ppo-staged-pd_ee_delta_pos/videos/trajectory.rgb.pd_ee_delta_pos.physx_cuda.dino16.mmap.frac1.0.h5
    json_path: ${data_dir}/maniskill/${.task_name}-ppo-staged-pd_ee_delta_pos/videos/trajectory.rgb.pd_ee_delta_pos.physx_cuda.dino16.mmap.frac1.0.json

encoder: ${dino_bisim}
dynamics: ${dino_bisim}
# `reward` is the fresh head above, not the world model's zero-valued one -- `model@reward`
# in the defaults already binds this key, so it must not be re-pointed at ${dino_bisim} here.
# The world model implements neither RewardModelBase nor StateValueModelBase, so it
# cannot stand in as a value model -- there is no goal-distance `state_value` to
# bootstrap. This run fits the reward head and needs no value at all.
value: null
# No planner: this run only fits the reward head, and `_self_` comes last in the defaults,
# so a `planner` group selected there would be overridden by this anyway. AgentModel takes
# `planner=None` -- its PLANNING action mode needs only dynamics and reward.
planner: null
policy: null

loss_function_weights:
  reward: 1.0

device: cuda:0
seed: 1

# Read by the task, which stages the recording into it when set (`copy_dataset_to_local_dir`).
local_dir: null
project_root: ???
data_dir: ???
checkpoint_dir: ???
output_dir: ???
